[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hearth-server"
version = "0.1.0"
description = "Hearth media server — core API"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "webauthn>=2.2",          # passkeys — primary auth factor
    "cryptography>=43.0",     # envelope encryption for OAuth tokens
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
# Without this, flat-layout auto-discovery sees both `app` and `migrations` as
# top-level packages and refuses to guess. Using `find` rather than an explicit
# list also keeps the Dockerfile's dependency-only layer working, where
# pyproject.toml is copied before the source is.
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = [
    "S101",  # assert is fine in tests
    "B008",  # Depends(...) in a default is the FastAPI idiom, not a bug
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
