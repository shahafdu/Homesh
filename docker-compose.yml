# Mode A (all-in-one) — see docs/ARCHITECTURE.md §3.4.
# Runs on Windows (amd64), Raspberry Pi and Oracle Ampere (arm64) unchanged.

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Deterministic collation, so ORDER BY doesn't shift under us between hosts.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host: only the api service needs it.
    expose:
      - "5432"

  api:
    build:
      # Root context: the image bundles both the API and the built web client.
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Thumbnails and previews. Access-controlled by the API, never served
      # as a public static directory (ARCHITECTURE.md §6).
      - media-cache:/var/lib/homesh/cache
      # The built TV app, so a set-top box can install it over the LAN rather
      # than needing a cable or a developer machine. Read-only; absent until
      # tools/build-tv-apk.sh has been run, which the route handles.
      - ./build:/app/tv-app:ro
      # Your media, mounted READ-ONLY. The server indexes and streams; it has no
      # business writing to your library.
      - ${MEDIA_HOST_PATH:-./sample-media}:/media/library:ro
      # Folders picked with tools/add-folder.ps1 are mounted read-only under
      # /library by docker-compose.override.yml, which that script maintains.
      # Nothing here enumerates the machine: the server sees the folders it has
      # been given and no others.
      # The Drive credential, mounted read-only. Kept out of the image so it is
      # never baked into a layer that could be pushed somewhere.
      - ./.secrets:/run/secrets:ro
    ports:
      - "8080:8080"
      # Port 80 as well, purely so the address a television has to be given is
      # short. "192.168.x.x/tv" can be typed on a remote control in a few
      # seconds; the same address with ":8080" in the middle is where somebody
      # gives up, or a browser decides the whole thing was a search query.
      # 8080 keeps working — nothing that already points at it has to change.
      - "${HTTP_PORT:-80}:8080"
      # Discovery. UDP, LAN only, and it answers one question — where the server
      # is — to a probe that names this application. It is what saves spelling an
      # address out on a television with a remote control.
      - "45877:45877/udp"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  db-data:
  media-cache:
