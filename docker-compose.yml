# Mode A (all-in-one) — see docs/ARCHITECTURE.md §3.4.
# Runs on Windows (amd64), Raspberry Pi and Oracle Ampere (arm64) unchanged.

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Deterministic collation, so ORDER BY doesn't shift under us between hosts.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host: only the api service needs it.
    expose:
      - "5432"

  api:
    build:
      # Root context: the image bundles both the API and the built web client.
      context: .
      dockerfile: server/Dockerfile
      target: server
      args:
        # The commit date and short id, set by the start and deploy scripts.
        HOMESH_BUILD: ${HOMESH_BUILD:-}
    restart: unless-stopped
    env_file: .env
    # default for the database and the house; convert for the converter.
    networks: [default, convert]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Thumbnails and previews. Access-controlled by the API, never served
      # as a public static directory (ARCHITECTURE.md §6).
      - media-cache:/var/lib/homesh/cache
      # Database backups. A named volume rather than the cache, which is
      # disposable by definition, and rather than a bind mount inside the
      # repository, which is how a dump of everybody's passkeys ends up in a
      # commit. Copies belong somewhere this machine is not -- the app can hand
      # one to you to take away, but it cannot put it there for you.
      - db-backups:/var/lib/homesh/backups
      # The built TV app, so a set-top box can install it over the LAN rather
      # than needing a cable or a developer machine. Read-only; absent until
      # tools/build-tv-apk.sh has been run, which the route handles.
      - ./build:/app/tv-app:ro
      # Your media, mounted READ-ONLY. The server indexes and streams; it has no
      # business writing to your library.
      - ${MEDIA_HOST_PATH:-./sample-media}:/media/library:ro
      # Folders granted from the PC land here, one directory each, read-only.
      # docker-compose.override.yml holds them; "Add a folder to Homesh" on the
      # PC writes it. The server registers what it finds and can reach nothing
      # else -- the same shape as a Drive folder shared with the Homesh account,
      # and the same guarantee: what was granted, and not the rest of the disk.
      # The Drive credential, mounted read-only. Kept out of the image so it is
      # never baked into a layer that could be pushed somewhere.
      - ./.secrets:/run/secrets:ro
    ports:
      - "8080:8080"
      # Port 80 as well, purely so the address a television has to be given is
      # short. "192.168.x.x/tv" can be typed on a remote control in a few
      # seconds; the same address with ":8080" in the middle is where somebody
      # gives up, or a browser decides the whole thing was a search query.
      # 8080 keeps working — nothing that already points at it has to change.
      - "${HTTP_PORT:-80}:8080"
      # Discovery. UDP, LAN only, and it answers one question — where the server
      # is — to a probe that names this application. It is what saves spelling an
      # address out on a television with a remote control.
      - "45877:45877/udp"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Renders office documents as PDFs, for the api service alone (app/converter.py).
  #
  # LibreOffice has a long history of documents that read local files or run
  # code, so it runs here rather than beside the server's keys -- in a container
  # with nothing worth stealing. That is the whole point of this service, and
  # server/tests/test_converter.py fails if any of it is added back:
  # no env_file, no environment, no volumes, no published ports, and only the
  # internal network, which reaches neither the database nor the internet.
  converter:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: converter
    restart: unless-stopped
    environment: {}
    networks: [convert]
    expose: ["8091"]
    read_only: true
    tmpfs:
      - /tmp:size=1g
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8091/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # Internal: no route out of it. Only the api service and the converter are on
  # it, so the converter can be reached by nothing else and can reach nothing.
  convert:
    internal: true

volumes:
  db-backups:
  db-data:
  media-cache:
