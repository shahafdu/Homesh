# The standby on Oracle -- see docs/STANDBY.md.
#
# A separate file rather than an override of docker-compose.yml, because what
# differs is mostly what must NOT be there: no media, no folders granted from a
# PC, no LAN discovery, and nothing published beyond the loopback address. An
# override can add to those lists but cannot take anything out of them, and
# "the port is still open because compose merged the lists" is not a mistake
# worth leaving available.

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    expose:
      - "5432"

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: server
      args:
        # The commit date and short id, set by the start and deploy scripts.
        HOMESH_BUILD: ${HOMESH_BUILD:-}
    restart: unless-stopped
    env_file: .env
    # default for the database and the house; convert for the converter.
    networks: [default, convert]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media-cache:/var/lib/homesh/cache
      # Where a backup pulled from the bucket lands before it is restored.
      - db-backups:/var/lib/homesh/backups
      # The Drive credential. The standby reads Drive itself -- that is how it
      # plays anything at all while the PC is off.
      - ./.secrets:/run/secrets:ro
    ports:
      # Loopback only. The way in is Tailscale, which proxies to this port from
      # inside the machine; nothing on the public address answers. Oracle's
      # security list also allows only SSH, so this is the second of two locks.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Renders office documents as PDFs, for the api service alone (app/converter.py).
  #
  # LibreOffice has a long history of documents that read local files or run
  # code, so it runs here rather than beside the server's keys -- in a container
  # with nothing worth stealing. That is the whole point of this service, and
  # server/tests/test_converter.py fails if any of it is added back:
  # no env_file, no environment, no volumes, no published ports, and only the
  # internal network, which reaches neither the database nor the internet.
  converter:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: converter
    restart: unless-stopped
    environment: {}
    networks: [convert]
    expose: ["8091"]
    read_only: true
    tmpfs:
      - /tmp:size=1g
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8091/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  # Internal: no route out of it. Only the api service and the converter are on
  # it, so the converter can be reached by nothing else and can reach nothing.
  convert:
    internal: true

volumes:
  db-backups:
  db-data:
  media-cache:
