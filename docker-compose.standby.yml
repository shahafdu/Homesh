# The standby on Oracle -- see docs/STANDBY.md.
#
# A separate file rather than an override of docker-compose.yml, because what
# differs is mostly what must NOT be there: no media, no folders granted from a
# PC, no LAN discovery, and nothing published beyond the loopback address. An
# override can add to those lists but cannot take anything out of them, and
# "the port is still open because compose merged the lists" is not a mistake
# worth leaving available.

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    expose:
      - "5432"

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        # The commit date and short id, set by the start and deploy scripts.
        HOMESH_BUILD: ${HOMESH_BUILD:-}
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media-cache:/var/lib/homesh/cache
      # Where a backup pulled from the bucket lands before it is restored.
      - db-backups:/var/lib/homesh/backups
      # The Drive credential. The standby reads Drive itself -- that is how it
      # plays anything at all while the PC is off.
      - ./.secrets:/run/secrets:ro
    ports:
      # Loopback only. The way in is Tailscale, which proxies to this port from
      # inside the machine; nothing on the public address answers. Oracle's
      # security list also allows only SSH, so this is the second of two locks.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  db-backups:
  db-data:
  media-cache:
